<style>
:root{--bg:#080b11;--p:#111722;--p2:#171f2d;--line:#2a3548;--text:#f7f9fc;--muted:#9ba8bc;--accent:#00e9ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#152035 0,#080b11 40%,#05070b 100%);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}

.sec{border:1px solid var(--line);background:#0d131d;border-radius:11px;padding:10px;margin-bottom:9px}.sec h3{margin:0 0 9px;font-size:13px}.f{display:grid;gap:5px;margin-bottom:8px}.f span{font-size:11px;color:#aab5c6;font-weight:700}.f input,.f textarea,.f select,.miniinput{width:100%;border:1px solid #334056;background:#161e2b;color:#fff;border-radius:8px;padding:8px}.f textarea{min-height:72px;resize:vertical}.row2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.range{display:grid;grid-template-columns:70px 1fr 28px;gap:7px;align-items:center;font-size:12px;margin:6px 0}.range input{accent-color:var(--accent)}.pal{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.sw{width:27px;height:27px;border-radius:7px;border:2px solid #56627a}.sw.on{outline:2px solid #fff}.grid{display:grid;border:1px solid #677;user-select:none}.cell{aspect-ratio:1;background:#ddd;border-right:1px solid #888;border-bottom:1px solid #888;cursor:crosshair}.card{width:270px;height:378px;border-radius:12px;background:#d6d6d6;border:1px solid #000;padding:9px;color:#111;flex:none;box-shadow:0 18px 40px #0007}.inner{height:100%;background:#fff;border-radius:9px;overflow:hidden;position:relative}.ct{height:42px;background:var(--c);border:2px solid #083047;display:flex;align-items:center;justify-content:center;font:bold 17px Georgia;padding:0 8px}.art{height:calc(100% - 42px);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:32px;font-weight:800}.art img{width:100%;height:100%;object-fit:cover}.back .inner{background:#050505;color:#fff;padding:9px}.back .ct{margin:-9px -9px 7px}.box{background:#d7d7d7;color:#111;border:2px solid #0b3045;border-radius:8px;padding:7px;text-align:center;white-space:pre-wrap;overflow:auto}.title{font:bold 15px Georgia;margin:4px 0}.stats{display:grid;gap:4px}.st{display:grid;grid-template-columns:67px 1fr 20px;gap:5px;align-items:center;font:12px Georgia}.bar{height:12px;background:#ddd;position:relative}.bar i{display:block;height:100%;background:#333;width:var(--v)}.icons{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.ic{border:1px solid #3c485d;background:#151d2a;color:#fff;border-radius:7px;padding:7px;font-size:20px}.ic.on{border-color:var(--accent)}.ait{width:100%;border-collapse:collapse;background:#e2e6eb;color:#111;font-size:11px}.ait td,.ait th{border:1px solid #fff;text-align:center;padding:4px}.ait th{background:#fffb00}.mapwrap{background:#0ca9e8;padding:13px;position:relative}.mapg{display:grid;grid-template-columns:repeat(17,1fr);aspect-ratio:1;background:#ddd;border:3px solid var(--mb);position:relative;overflow:hidden}.mapc{border-right:1px solid #888;border-bottom:1px solid #888;z-index:2}.mimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;opacity:.9}.arr{position:absolute;z-index:4;color:var(--ma);font-size:22px;font-weight:900}.crit{width:100%;border-collapse:collapse}.crit td{background:#d7dbe0;color:#111;border:1px solid #fff;padding:5px;font-size:11px}.small{font-size:11px;color:var(--muted)}@media(max-width:1100px){.app{grid-template-columns:190px 1fr}.right{grid-column:1/-1}.editor{max-height:none}}@media(max-width:720px){.top{align-items:flex-start;flex-direction:column}.app{grid-template-columns:1fr}.menu{grid-template-columns:1fr 1fr}.stage{justify-content:flex-start;min-height:500px}}
</style>

<body>
<div class="top"><div><div class="small" style="color:#00e9ff;font-weight:900;letter-spacing:.22em">BLITZ</div><h1>Dimensions of Paradox — Card Studio</h1></div><div class="actions"><button class="btn" id="save">Guardar local</button><button class="btn" id="exp">Exportar JSON</button><label class="btn file">Importar JSON<input id="imp" type="file" accept=".json,application/json"></label><button class="btn danger" id="reset">Reiniciar</button></div></div>
<div class="app">
<aside class="panel"><div class="pt">Tipos de carta</div><div class="menu" id="menu"></div></aside>
<section class="work"><div class="panel toolbar"><b id="lab"></b><div><button class="btn side" data-s="front">Frente</button><button class="btn side" data-s="back">Reverso</button><button class="btn side" data-s="both">Ambas</button></div></div><div class="stage" id="stage"></div></section>
<aside class="panel right"><div class="pt">Propiedades</div><div class="editor" id="ed"></div></aside>
</div>
<script>
var TYPES=[
['skillPassive','Habilidad pasiva','#00e9ff','✦'],['skillActive','Habilidad activa','#00e9ff','⚡'],['weapon','Arma','#be5cff','◈'],['elemental','Poder elemental','#ff9730','🔥'],['object','Objeto','#f4b6ef','⬡'],['enemy1','Enemigo nivel 1','#ff1111','1'],['enemy2','Enemigo nivel 2','#ff1111','2'],['enemy3','Enemigo nivel 3','#ff1111','3'],['enemy4','Enemigo nivel 4','#ff1111','4'],['ai','Carta IA','#fffb00','IA'],['character','Personaje','#49d45e','♟'],['map','Mapa','#f2f2f2','⌖']];
var ICONS=['🔥','💧','🌿','⚡','❄️','🌑','☀️','💨','🪨','☠️'], ST=['Ataque','Vida','Velocidad','PA'], PAL=['#111111','#ffffff','#ff1111','#00e9ff','#be5cff','#ff9730','#49d45e','#fffb00'];
function blank(){return Array(225).fill(null)}function base(id){var t=TYPES.find(function(x){return x[0]===id});var lv=id.indexOf('enemy')===0?+id.replace('enemy',''):1;return{type:id,name:'Nombre de la carta',art:'',description:'Inserte texto de descripción',accent:t[2],stats:{Ataque:0,Vida:0,Velocidad:0,PA:0},technique:'Inserte texto de descripción',weapon:{grid:blank(),palette:PAL.slice(),paint:'#111111',cost:2,costType:'PA'},elemental:{strengths:['🔥','⚡'],weaknesses:['💧','❄️'],affinity:'Inserte texto de descripción'},object:{objectType:'Objeto especial',actions:'Inserte texto de descripción'},enemy:{a:blank(),b:blank(),palette:PAL.slice(),paint:'#111111',attack:3,life:10,speed:3,pa:lv,element:'🔥',ia:'Berserker A',ia2:'Berserker B',second:lv>=3,actions:Array(6).fill('Inserte texto de descripción')},ai:{cells:Array.from({length:10},function(){return[1,2,3]})},character:{attack:5,life:5,speed:5,pa:5},map:{border:'#07304d',arrow:'#07304d',label:'#000000',image:'',arrows:{N:[1,0],NE:[1,0],E:[1,0],SE:[1,0],S:[1,0],SW:[1,0],W:[1,0],NW:[1,0]},critical:[['A4','Llaves del abismo de fuego'],['J3','Puente roto'],['I3','Santuario']]}}}
var state={type:'skillPassive',side:'both',cards:{}};TYPES.forEach(function(t){state.cards[t[0]]=base(t[0])});
var $=function(q){return document.querySelector(q)}, C=function(){return state.cards[state.type]}, esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function menu(){var m=$('#menu');m.innerHTML=TYPES.map(function(t){return'<button class="type '+(t[0]===state.type?'active':'')+'" data-t="'+t[0]+'"><span class="dot" style="background:'+t[2]+'"></span>'+t[1]+'</button>'}).join('');m.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){state.type=b.dataset.t;render()}})}
function front(c,t){return'<div class="card" style="--c:'+c.accent+'"><div class="inner"><div class="ct">'+esc(c.name)+'</div><div class="art">'+(c.art?'<img src="'+c.art+'">':'Arte')+'</div></div></div>'}
function stats(o){return'<div class="stats">'+ST.map(function(n){var v=Math.max(0,Math.min(10,+o[n]||0));return'<div class="st"><span>'+n+'</span><div class="bar"><i style="--v:'+v*10+'%"></i></div><b>'+v+'</b></div>'}).join('')+'</div>'}
function grid(arr,editable,id){return'<div class="grid" data-grid="'+id+'" style="grid-template-columns:repeat(15,1fr)">'+arr.map(function(c,i){return'<div class="cell" data-i="'+i+'" style="'+(c?'background:'+c:'')+'"></div>'}).join('')+'</div>'}
function back(c,inner){return'<div class="card back" style="--c:'+c.accent+'"><div class="inner"><div class="ct">'+esc(c.name)+'</div>'+inner+'</div></div>'}
function enemyBack(c){var e=c.enemy,lv=+state.type.replace('enemy','');return back(c,'<div class="title">Acciones</div>'+e.actions.slice(0,lv===1?2:lv===2?3:lv===3?4:6).map(function(x,i){return'<div class="box" style="min-height:37px;margin-bottom:4px">'+esc(x)+'</div>'}).join('')+'<div class="title">Estadísticas</div><div class="row2"><div>Ataque '+e.attack+'<br>Vida '+e.life+'<br>Velocidad '+e.speed+'<br>PA '+e.pa+'</div><div style="text-align:center">Elemento<br><b style="font-size:25px">'+e.element+'</b><br>IA<br>'+esc(e.ia)+(e.second?'<br>½ '+esc(e.ia2):'')+'</div></div>')}
function mapBack(c){var m=c.map,cells=Array.from({length:289},function(){return'<div class="mapc"></div>'}).join(''),pos={N:'top:0;left:50%',NE:'top:0;right:2px',E:'right:0;top:50%',SE:'right:2px;bottom:0',S:'bottom:0;left:50%',SW:'left:2px;bottom:0',W:'left:0;top:50%',NW:'left:2px;top:0'},sym={N:['↑','↓'],NE:['↗','↙'],E:['→','←'],SE:['↘','↖'],S:['↓','↑'],SW:['↙','↗'],W:['←','→'],NW:['↖','↘']};var ar=Object.keys(m.arrows).map(function(k){var v=m.arrows[k];return v[0]?'<span class="arr" style="'+pos[k]+'">'+sym[k][v[1]]+'</span>':''}).join('');var cr='<table class="crit">'+m.critical.map(function(r){return'<tr><td style="width:45px">'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>'}).join('')+'</table>';return back(c,'<div class="mapwrap" style="--mb:'+m.border+';--ma:'+m.arrow+'"><div class="mapg">'+(m.image?'<img class="mimg" src="'+m.image+'">':'')+cells+ar+'</div></div><div class="title">Casillas críticas</div>'+cr)}
function preview(){var c=C(),t=TYPES.find(function(x){return x[0]===state.type}),f=front(c,t),b='';if(state.type.indexOf('skill')===0)b=back(c,'<div class="title">Técnica especial</div><div class="box" style="min-height:120px">'+esc(c.technique)+'</div><div class="title">Estadísticas mejoradas</div>'+stats(c.stats));else if(state.type==='weapon')b=back(c,'<div class="title">Mapa de ataque</div>'+grid(c.weapon.grid,0,'wp')+'<div style="text-align:center;margin-top:7px">Coste: '+c.weapon.cost+' '+c.weapon.costType+'</div>');else if(state.type==='elemental')b=back(c,'<div class="row2"><div><div class="title">Fortalezas</div><div style="font-size:27px">'+c.elemental.strengths.join(' ')+'</div></div><div><div class="title">Debilidades</div><div style="font-size:27px">'+c.elemental.weaknesses.join(' ')+'</div></div></div><div class="title">Afinidad</div><div class="box" style="min-height:120px">'+esc(c.elemental.affinity)+'</div>');else if(state.type==='object')b=back(c,'<div class="title">Tipo de objeto</div><div class="box">'+esc(c.object.objectType)+'</div><div class="title">Acciones desbloqueadas</div><div class="box" style="min-height:185px">'+esc(c.object.actions)+'</div>');else if(state.type.indexOf('enemy')===0){var lv=+state.type.replace('enemy','');f='<div class="card" style="--c:#ff1111"><div class="inner"><div class="ct">'+esc(c.name)+'</div><div class="art" style="height:60%">'+(c.art?'<img src="'+c.art+'">':'Arte')+'</div><div class="row2" style="background:#050505;color:#fff;padding:6px"><div>'+grid(c.enemy.a,0,'ea')+'</div><div>'+grid(c.enemy.b,0,'eb')+'</div></div></div></div>';b=enemyBack(c)}else if(state.type==='ai'){b=back(c,'<table class="ait"><tr><th>Acción</th><th>A</th><th>B</th><th>C</th></tr>'+c.ai.cells.map(function(r,i){return'<tr><td>'+(i+1)+'</td>'+r.map(function(v){return'<td>'+v+'</td>'}).join('')+'</tr>'}).join('')+'</table>')}else if(state.type==='character')b=back(c,'<div class="title">Estadísticas</div>'+stats({Ataque:c.character.attack,Vida:c.character.life,Velocidad:c.character.speed,PA:c.character.pa}));else if(state.type==='map')b=mapBack(c);$('#stage').innerHTML=state.side==='front'?f:state.side==='back'?b:f+b}
function fld(l,k,v,type){type=type||'text';return'<label class="f"><span>'+l+'</span>'+(type==='textarea'?'<textarea data-k="'+k+'">'+esc(v)+'</textarea>':type==='select'?'<select data-k="'+k+'">'+['PA','Vida'].map(function(o){return'<option '+(o===v?'selected':'')+'>'+o+'</option>'}).join('')+'</select>':'<input data-k="'+k+'" type="'+type+'" value="'+esc(v)+'">')+'</label>'}
function rng(l,k,v){return'<div class="range"><span>'+l+'</span><input data-k="'+k+'" type="range" min="0" max="10" value="'+v+'"><b>'+v+'</b></div>'}
function sec(t,h){return'<div class="sec"><h3>'+t+'</h3>'+h+'</div>'}
function pal(o,prefix){return'<div class="pal">'+o.palette.map(function(x){return'<button class="sw '+(x===o.paint?'on':'')+'" data-p="'+prefix+'" data-col="'+x+'" style="background:'+x+'"></button>'}).join('')+'<input id="'+prefix+'col" type="color" value="'+o.paint+'"><button class="btn" data-add="'+prefix+'">+ paleta</button></div>'}
function icons(label,key,val){return'<div class="f"><span>'+label+'</span><div class="icons">'+ICONS.map(function(i){return'<button class="ic '+(i===val?'on':'')+'" data-ik="'+key+'" data-iv="'+i+'">'+i+'</button>'}).join('')+'</div></div>'}
function editor(){var c=C(),h=sec('General',fld('Nombre','name',c.name)+fld('Arte','artFile','','file')+fld('Descripción','description',c.description,'textarea'));if(state.type.indexOf('skill')===0)h+=sec('Habilidad',fld('Técnica especial','technique',c.technique,'textarea')+ST.map(function(n){return rng(n,'stats.'+n,c.stats[n])}).join(''));if(state.type==='weapon')h+=sec('Mapa de ataque',pal(c.weapon,'w')+grid(c.weapon.grid,1,'w'))+sec('Coste','<div class="row2">'+fld('Cantidad','weapon.cost',c.weapon.cost,'number')+fld('Recurso','weapon.costType',c.weapon.costType,'select')+'</div>');if(state.type==='elemental')h+=sec('Fortalezas',icons('Fortaleza 1','elemental.strengths.0',c.elemental.strengths[0])+icons('Fortaleza 2','elemental.strengths.1',c.elemental.strengths[1]))+sec('Debilidades',icons('Debilidad 1','elemental.weaknesses.0',c.elemental.weaknesses[0])+icons('Debilidad 2','elemental.weaknesses.1',c.elemental.weaknesses[1]))+sec('Afinidad',fld('Texto','elemental.affinity',c.elemental.affinity,'textarea'));if(state.type==='object')h+=sec('Objeto',fld('Tipo','object.objectType',c.object.objectType)+fld('Acciones desbloqueadas','object.actions',c.object.actions,'textarea'));if(state.type.indexOf('enemy')===0){var e=c.enemy,lv=+state.type.replace('enemy','');h+=sec('Mapas de ataque',pal(e,'e')+'<div class="row2"><div>'+grid(e.a,1,'ea')+'</div><div>'+grid(e.b,1,'eb')+'</div></div>')+sec('Estadísticas','<div class="row2">'+fld('Ataque','enemy.attack',e.attack,'number')+fld('Vida','enemy.life',e.life,'number')+fld('Velocidad','enemy.speed',e.speed,'number')+fld('PA','enemy.pa',e.pa,'number')+'</div>'+icons('Elemento','enemy.element',e.element))+sec('IA',fld('IA principal','enemy.ia',e.ia)+(lv>=3?fld('IA secundaria','enemy.ia2',e.ia2)+'<label><input type="checkbox" data-k="enemy.second" '+(e.second?'checked':'')+'> Mostrar IA ½</label>':''))+sec('Acciones',e.actions.slice(0,lv===1?2:lv===2?3:lv===3?4:6).map(function(x,i){return fld('Acción '+(i+1),'enemy.actions.'+i,x,'textarea')}).join(''))}if(state.type==='ai')h+=sec('Tabla IA','<div class="small">Cada celda acepta números del 1 al 6.</div><table class="ait">'+c.ai.cells.map(function(r,ri){return'<tr><td>'+(ri+1)+'</td>'+r.map(function(v,ci){return'<td><input class="miniinput" type="number" min="1" max="6" value="'+v+'" data-air="'+ri+'" data-aic="'+ci+'"></td>'}).join('')+'</tr>'}).join('')+'</table>');if(state.type==='character')h+=sec('Estadísticas',rng('Ataque','character.attack',c.character.attack)+rng('Vida','character.life',c.character.life)+rng('Velocidad','character.speed',c.character.speed)+rng('PA','character.pa',c.character.pa));if(state.type==='map'){var m=c.map;h+=sec('Apariencia','<div class="row3">'+fld('Contorno','map.border',m.border,'color')+fld('Flechas','map.arrow',m.arrow,'color')+'<label class="f"><span>Letras</span><select data-k="map.label"><option value="#000000" '+(m.label==='#000000'?'selected':'')+'>Negro</option><option value="#ffffff" '+(m.label==='#ffffff'?'selected':'')+'>Blanco</option></select></label></div>'+fld('Imagen del mapa','mapFile','','file'));h+=sec('Flechas',Object.keys(m.arrows).map(function(k){var v=m.arrows[k];return'<div class="row3" style="margin:6px 0"><b>'+k+'</b><label><input type="checkbox" data-ar="'+k+'" data-ap="0" '+(v[0]?'checked':'')+'> Visible</label><label><input type="checkbox" data-ar="'+k+'" data-ap="1" '+(v[1]?'checked':'')+'> Invertir</label></div>'}).join(''));h+=sec('Casillas críticas',m.critical.map(function(r,i){return'<div class="row2" style="margin-bottom:6px"><input class="miniinput" data-cr="'+i+'" data-cp="0" value="'+esc(r[0])+'"><input class="miniinput" data-cr="'+i+'" data-cp="1" value="'+esc(r[1])+'"></div>'}).join('')+'<button class="btn" id="addcr">+ casilla</button>')};$('#ed').innerHTML=h;bind()}
function setp(o,path,val){var a=path.split('.'),r=o;for(var i=0;i<a.length-1;i++)r=r[a[i]];r[a[a.length-1]]=val}
function readImg(file,cb){if(!file)return;var r=new FileReader;r.onload=function(){cb(r.result)};r.readAsDataURL(file)}
